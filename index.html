<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f2ecdd" />
    <title>Flappy Sketch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Flappy Sketch 游戏区域">
      <div id="canvas-host" aria-hidden="true"></div>

      <header class="hud">
        <div class="score-card">
          <span class="score-label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="best-card">
          <span class="score-label">BEST</span>
          <strong id="best">0</strong>
        </div>
      </header>

      <section id="start-panel" class="panel visible" aria-live="polite">
        <div class="panel-card">
          <p class="eyebrow">PENCIL SKETCH · FLAPPY</p>
          <h1>别碰尖尖</h1>
          <p class="hint">点击 / 触摸 / 空格让角色往上蹦。铅笔笔尖、美工刀刀片和雨伞尖都会对着中间。</p>
          <button id="start-button" type="button">开始乱飞</button>
          <p class="subhint">每次起跳，屁股后面都会喷一小团铅笔烟。</p>
        </div>
      </section>

      <section id="game-over-panel" class="panel" aria-live="polite">
        <div class="panel-card compact">
          <p class="eyebrow">GAME OVER</p>
          <h2>撞尖尖了</h2>
          <div class="result-row">
            <div><span>本次</span><strong id="final-score">0</strong></div>
            <div><span>最佳</span><strong id="final-best">0</strong></div>
          </div>
          <button id="restart-button" type="button">再来一次</button>
        </div>
      </section>

      <div class="tap-tip">TAP · SPACE</div>
    </main>

    <script type="module" src="./src/game-v2.js"></script>
  </body>
</html>
