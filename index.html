<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070d1b" />
    <title>Flappy Color</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Flappy Color 游戏区域">
      <div id="canvas-host" aria-hidden="true"></div>
      <header class="hud">
        <div class="score-card"><span class="score-label">SCORE</span><strong id="score">0</strong></div>
        <div class="hp-card" aria-label="生命值"><span class="score-label">HP</span><div id="hearts" class="hearts" aria-hidden="true"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></div></div>
        <div class="best-card"><span class="score-label">BEST</span><strong id="best">0</strong></div>
      </header>

      <section id="start-panel" class="panel visible" aria-live="polite">
        <div class="panel-card">
          <p class="eyebrow">NIGHT COLOR · FLAPPY</p>
          <h1>三颗心，够你死三次</h1>
          <p class="hint">尖尖蹭一下就收你一颗心。铜锣烧偶尔施舍，绿药负责劝退。掉出屏幕？连抢救都省了。</p>
          <button id="start-button" class="icon-button" type="button" aria-label="开始游戏">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 15 L49 32 L22 49 Z"/></svg>
          </button>
          <p class="subhint">20 分以后，柱子也开始看不惯你，会自己上下找你。背景音乐会很轻，免得影响你听惨叫。</p>
        </div>
      </section>

      <section id="game-over-panel" class="panel" aria-live="polite">
        <div class="watching-eye" aria-hidden="true"><span></span></div>
        <div class="panel-card compact">
          <p class="eyebrow">GAME OVER</p>
          <h2>它一直在等你失误</h2>
          <div class="result-row">
            <div><span>本次交代</span><strong id="final-score">0</strong></div>
            <div><span>还能嘴硬</span><strong id="final-best">0</strong></div>
          </div>
          <button id="restart-button" class="icon-button restart" type="button" aria-label="重新开始">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 24a18 18 0 1 1-2 16" fill="none"/><path d="M11 13v15h15"/></svg>
          </button>
          <p class="death-note">别急，下一把也不一定更体面。</p>
        </div>
      </section>

      <div class="tap-tip">TAP · SPACE</div>
    </main>
    <script type="module" src="./src/game-v7.js"></script>
  </body>
</html>
