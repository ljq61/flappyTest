<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070d1b" />
    <title>Flappy Color</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Flappy Color 游戏区域">
      <div id="canvas-host" aria-hidden="true"></div>
      <header class="hud">
        <div class="score-card"><span class="score-label">SCORE</span><strong id="score">0</strong></div>
        <div class="hp-card" aria-label="生命值"><span class="score-label">HP</span><div id="hearts" class="hearts" aria-hidden="true"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></div></div>
        <div class="best-card"><span class="score-label">BEST</span><strong id="best">0</strong></div>
      </header>

      <section id="start-panel" class="panel visible" aria-live="polite">
        <div class="panel-card">
          <p class="eyebrow">NIGHT COLOR · FLAPPY</p>
          <h1>悬崖都给你搭好了</h1>
          <p class="hint">身后厕所都比你稳。第一下跳出去，就没有“我再想想”这回事了。</p>
          <button id="start-button" class="icon-button" type="button" aria-label="开始游戏" title="火箭发射，开始游戏">
            <img class="button-icon" src="./assets/rocket-launch.png" width="54" height="54" alt="" draggable="false" />
          </button>
          <p class="subhint">20 分以后柱子会主动找你。音乐负责装可爱，尖尖负责讲道理。</p>
        </div>
      </section>

      <section id="game-over-panel" class="panel" aria-live="polite">
        <div class="watching-eyes" aria-hidden="true">
          <span class="watching-eye"></span>
          <span class="watching-eye"></span>
        </div>
        <div class="panel-card compact">
          <p class="eyebrow">GAME OVER</p>
          <h2>它们早就看见了</h2>
          <div class="result-row">
            <div><span>本次交代</span><strong id="final-score">0</strong></div>
            <div><span>还能嘴硬</span><strong id="final-best">0</strong></div>
          </div>
          <button id="restart-button" class="icon-button restart" type="button" aria-label="重新开始" title="返回厕所，重新开始">
            <img class="button-icon" src="./assets/return-toilet.png" width="54" height="54" alt="" draggable="false" />
          </button>
          <p class="death-note">别回头。后面那几个厕所都在笑。</p>
        </div>
      </section>

      <div class="tap-tip">TAP · SPACE</div>
    </main>
    <script type="module" src="./src/game-v8.js"></script>
  </body>
</html>
